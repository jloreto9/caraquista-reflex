version: "3.7"

services:
  republicaraquistapp-reflex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: republicaraquistapp-reflex
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - root_default
    healthcheck:
      test: ["CMD-SHELL", "curl -f --connect-timeout 5 --max-time 10 http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.caraquista.rule=Host(`caraquista.srv929207.hstgr.cloud`)"
      - "traefik.http.routers.caraquista.tls=true"
      - "traefik.http.routers.caraquista.entrypoints=web,websecure"
      - "traefik.http.routers.caraquista.tls.certresolver=mytlschallenge"
      - "traefik.http.services.caraquista.loadbalancer.server.port=3000"

networks:
  root_default:
    external: true
