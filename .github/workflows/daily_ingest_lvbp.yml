name: Ingesta Diaria LVBP (Batch ETL)

on:
  schedule:
    # 06:00 UTC = 02:00 AST (Hora Venezuela/RD)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Temporada LVBP a ingerir'
        required: false
        default: '2025'
      all_seasons:
        description: 'Ingerir 2023, 2024 y 2025'
        type: boolean
        required: false
        default: false

jobs:
  ingest:
    name: Ingesta Batch a Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Batch Ingestion Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ github.event.inputs.all_seasons }}" = "true" ]; then
            python scripts/ingest_lvbp_batch.py --all-seasons --with-pbp
          else
            SEASON="${{ github.event.inputs.season || '2025' }}"
            python scripts/ingest_lvbp_batch.py --season "$SEASON" --with-pbp
          fi

      - name: Keep-Alive Ping (Supabase Free Tier Protection)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "import os, requests; url = os.environ.get('SUPABASE_URL'); key = os.environ.get('SUPABASE_KEY'); requests.get(f'{url}/rest/v1/teams?select=id&limit=1', headers={'apikey': key, 'Authorization': f'Bearer {key}'}) if url and key else None; print('Ping Keep-Alive ejecutado con éxito.')"
